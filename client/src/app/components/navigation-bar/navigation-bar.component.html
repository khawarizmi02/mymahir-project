<div class="navbar-container" *ngIf="shouldShowNavbar()">
  <!-- Header -->
  <header class="navbar-header">
    <!-- Left: Logo + Toggle -->
    <div class="navbar-left">
      <button class="menu-toggle-btn" (click)="toggleSidebar()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="logo-section">
        <div class="logo">M</div>
        <h1 class="app-title">MySewa</h1>
      </div>
    </div>

    <!-- Center: Breadcrumb/Page Title (Optional) -->
    <div class="navbar-center">
    </div>

    <!-- Right: User Menu -->
    <div class="navbar-right">
      <!-- Notifications (if needed) -->
      <!-- <button class="icon-btn" matTooltip="Notifications">
        <mat-icon>notifications</mat-icon>
      </button> -->

      <!-- User Profile Menu (Desktop) -->
      <button class="user-profile-btn" *ngIf="!isMobileView()" [matMenuTriggerFor]="userMenu" matTooltip="User Menu">
        <div class="user-avatar">{{ getInitials(userEmail()) }}</div>
        <span class="user-info">
          <span class="user-name">{{ userEmail().split('@')[0] }}</span>
          <span class="user-role">{{ userRole() === 'tenant' ? 'Tenant' : 'Landlord' }}</span>
        </span>
      </button>

      <!-- Mobile User Menu -->
      <button class="mobile-user-btn" *ngIf="isMobileView()" [matMenuTriggerFor]="mobileUserMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="navbar-sidebar" [class.active]="!isCollapsed()">
    <!-- Sidebar Overlay (Mobile) -->
    <div class="sidebar-overlay" *ngIf="isMobileView()" (click)="toggleSidebar()"></div>

    <!-- Sidebar Content -->
    <div class="sidebar-content">
      <!-- User Card (Mobile) -->
      <div class="user-card" *ngIf="isMobileView()">
        <div class="user-avatar-lg">{{ getInitials(userName()) }}</div>
        <h3>{{ userName() }}</h3>
        <p>{{ userEmail().split('@')[0] }}</p>
        <span class="role-badge" [ngClass]="'role-' + userRole()">
          {{ userRole() === 'tenant' ? 'Tenant' : 'Landlord' }}
        </span>
      </div>

      <!-- Navigation Menu -->
      <nav class="sidebar-nav">
        <a *ngFor="let item of menuItems()" 
           [routerLink]="item.route"
           routerLinkActive="active"
           class="nav-link"
           (click)="navigateTo(item.route)">
          <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <button class="logout-link" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </aside>
</div>

<!-- User Dropdown Menu (Desktop) -->
<mat-menu #userMenu="matMenu" class="user-dropdown-menu">
  <button mat-menu-item (click)="goToProfile()">
    <mat-icon>person</mat-icon>
    <span>Profile Settings</span>
  </button>
  <button mat-menu-item>
    <mat-icon>settings</mat-icon>
    <span>Settings</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Logout</span>
  </button>
</mat-menu>

<!-- User Dropdown Menu (Mobile) -->
<mat-menu #mobileUserMenu="matMenu" class="mobile-dropdown-menu">
  <div class="menu-user-card">
    <div class="user-avatar-sm">{{ getInitials(userName()) }}</div>
    <div>
      <p class="menu-user-name">{{ userName() }}</p>
      <p class="menu-user-email">{{ userEmail() }}</p>
    </div>
  </div>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="goToProfile()">
    <mat-icon>person</mat-icon>
    <span>Profile</span>
  </button>
  <button mat-menu-item>
    <mat-icon>settings</mat-icon>
    <span>Settings</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Logout</span>
  </button>
</mat-menu>
