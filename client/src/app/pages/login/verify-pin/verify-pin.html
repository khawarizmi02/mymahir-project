<div class="auth-container">
	<h2>Enter Your PIN</h2>
	@if (email()) {
	<p>We sent a 6-digit PIN to <strong>{{ email() }}</strong></p>
	} @else {
	<p>Check your email for the 6-digit code</p>
	}

	<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
		<mat-form-field appearance="outline" class="email-field">
			<mat-label>Email</mat-label>
			<input matInput formControlName="email" type="email" required [readonly]="email()" [value]="email()" />
		</mat-form-field>

		<!-- OTP Input Field using ng-otp-input library -->
		<div class="otp-container">
			<label class="otp-label">6-digit PIN</label>
			<ng-otp-input
				#otpComponent
				[config]="{ length: 6, allowNumbersOnly: true, placeholder: '0', inputClass: 'custom-otp-input' }"
				(onInputChange)="onOtpChange($event)"
			/>
		</div>

		<button mat-raised-button color="primary" type="submit" [disabled]="isLoading() || form.invalid" class="submit-btn">
			{{ isLoading() ? 'Verifying...' : 'Login' }}
		</button>
	</form>

	<button mat-stroked-button routerLink="/login" class="request-pin-btn">Request New PIN</button>
</div>
